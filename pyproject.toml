[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domino-governance-mcp"
version = "0.1.0"
description = "MCP server exposing Domino Governance to GitHub Copilot"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
domino-governance-mcp = "domino_governance_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/domino_governance_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
